name: Docker Image CI

on:
  push:
    branches: [ "copilot/merge-all-open-prs" ]
  pull_request:
    branches: [ "copilot/merge-all-open-prs" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: arindamupadhyay
        password: Alohmora@20

    - name: Set Docker image version tag
      id: vars
      run: |
        BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
        SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
        DATE=$(date +%Y%m%d)
        VERSION_TAG="${BRANCH_NAME}-${SHORT_SHA}-${DATE}"
        echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

    - name: Build the Docker image
      id: build
      run: |
        docker build \
          --no-cache \
          --file Dockerfile \
          --tag arindamupadhyay/invoice-ai:latest \
          --tag arindamupadhyay/invoice-ai:${VERSION_TAG} \
          --memory=30g \
          .

    - name: Push Docker image to Docker Hub (latest)
      run: |
        docker push arindamupadhyay/invoice-ai:latest

    - name: Push Docker image to Docker Hub (versioned)
      run: |
        docker push arindamupadhyay/invoice-ai:${VERSION_TAG}
 