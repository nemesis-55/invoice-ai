### Model
model_name_or_path: openbmb/MiniCPM-V-4_5

### Method - Incremental LoRA Training
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
resume_lora_training: true  # KEY: enables incremental training

### Dataset
dataset_dir: data
dataset: invoice_extraction
template: qwen3  # V4.5 uses Qwen3 backbone
cutoff_len: 4096
preprocessing_num_workers: 16

### Output
output_dir: output/minicpmv45_invoice_lora
logging_steps: 10
save_steps: 500
save_total_limit: 5
overwrite_output_dir: true

### Training Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Evaluation
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
