### Model Configuration
model_name_or_path: openbmb/MiniCPM-V-4_5
# Load the previously trained LoRA adapter from HuggingFace to continue training on top of it
adapter_name_or_path: GothiaDigitalSolutions/invoice-extractor-llama-test
trust_remote_code: true

### Training Stage
stage: sft
do_train: true
finetuning_type: lora

### Incremental Training Mode
# This configuration continues training from the previously pushed LoRA adapter.
# It trains only on new data — no old/new data mixing is needed.

### Dataset Configuration
dataset: invoice_training
dataset_dir: llamafactory_configs
media_dir: .
template: minicpm_v
cutoff_len: 8192  # Increased from 4096 to 8192 for better document understanding (if GPU memory allows)
overwrite_cache: true
preprocessing_num_workers: 16

### Output Configuration
output_dir: output/minicpm_v45_incremental_lora
logging_dir: output/minicpm_v45_incremental_lora/logs
logging_steps: 10
save_steps: 250  # More frequent saving (every 250 steps instead of 500)
save_total_limit: 5  # Increased from 3 to 5 to keep more checkpoints
plot_loss: true
overwrite_output_dir: false

### Evaluation Configuration
val_size: 0.2
eval_strategy: steps
eval_steps: 250  # More frequent evaluation (every 250 steps instead of 500)
per_device_eval_batch_size: 1

### Training Hyperparameters - Same as base training
per_device_train_batch_size: 2  # Increased from 1 for better gradients
gradient_accumulation_steps: 4
learning_rate: 1.0e-5  # Same as base training (optimal for LoRA OCR tasks)
num_train_epochs: 5.0  # Same as base training for full convergence
lr_scheduler_type: cosine
warmup_ratio: 0.03  # Same as base training
warmup_steps: 100
bf16: true
weight_decay: 0.01  # Same as base training
max_grad_norm: 1.0  # Same as base training

### LoRA Configuration - Same as base training
lora_rank: 64  # Increased from 32 to 64 (optimal for OCR - better efficiency)
lora_alpha: 128  # Increased from 32 to 128 (rank * 8 scaling rule)
lora_dropout: 0.05
lora_target: all  # Target all linear layers for better OCR adaptation
additional_target: resampler  # Keep resampler for vision-language alignment

### DeepSpeed Configuration (optional)
# deepspeed: ds_config_zero2.json
# ddp_timeout: 180000000

### Hardware Optimization
gradient_checkpointing: true
ddp_find_unused_parameters: false

### Logging and Monitoring
report_to: tensorboard

### Vision Model Specific
freeze_vision_tower: true

### Incremental Training Notes:
# 1. adapter_name_or_path loads the previously trained LoRA from HuggingFace
# 2. Training continues on new data only (no old/new mixing)
# 3. Push the result to a NEW HuggingFace repo (do not overwrite the old one)
